<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
    <defs>
        <!-- Золотистый градиент (ближе к центру) -->
        <radialGradient id="grad_accent" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="var(--accent, #dc2626)" stop-opacity="1" />
            <stop offset="100%" stop-color="var(--accent, #dc2626)" stop-opacity="0" />
        </radialGradient>
        
        <!-- Темно-золотистый (дальше) -->
        <radialGradient id="grad_accent_hover" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="var(--accent-hover, #b91c1c)" stop-opacity="1" />
            <stop offset="100%" stop-color="var(--accent-hover, #b91c1c)" stop-opacity="0" />
        </radialGradient>
        
        <!-- Очень бледный (самый бледный) -->
        <radialGradient id="grad_muted" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="var(--text-muted, #94a3b8)" stop-opacity="1" />
            <stop offset="100%" stop-color="var(--text-muted, #94a3b8)" stop-opacity="0" />
        </radialGradient>
    </defs>

    <!-- Частица 1 -->
    <circle cx="200" cy="550" r="1.5" fill="url(#grad_accent)" opacity="1" />
    
    <!-- Частица 2 -->
    <circle cx="380" cy="680" r="2" fill="url(#grad_accent)" opacity="0.6" />
    
    <!-- Частица 3 -->
    <circle cx="500" cy="380" r="1.5" fill="url(#grad_accent_hover)" opacity="1" />
    
    <!-- Частица 4 -->
    <circle cx="620" cy="620" r="2" fill="url(#grad_accent_hover)" opacity="0.8" />
    
    <!-- Частица 5 -->
    <circle cx="800" cy="480" r="1.5" fill="url(#grad_muted)" opacity="0.7" />

</svg>
